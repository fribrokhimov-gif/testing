<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>QA Practice Todo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; }
    li { display: flex; justify-content: space-between; padding: 6px 0; }
    #count { font-weight: bold; }
  </style>
</head>
<body>
  <h1>Practice Todo App</h1>

  <input id="new-todo" type="text" placeholder="What needs doing?" />
  <button id="add-btn">Add</button>

  <p>Items: <span id="count">0</span></p>
  <ul id="todo-list"></ul>

  <script>
    const input = document.getElementById('new-todo');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('todo-list');
    const count = document.getElementById('count');

    function updateCount() {
      count.textContent = list.querySelectorAll('li').length;
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.className = 'todo-item';

      const span = document.createElement('span');
      span.className = 'todo-text';
      span.textContent = text;

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = 'Delete';
      delBtn.addEventListener('click', () => {
        li.remove();
        updateCount();
      });

      li.appendChild(span);
      li.appendChild(delBtn);
      list.appendChild(li);

      input.value = '';
      updateCount();
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTodo();
    });
  </script>
</body>
</html>
