name: Noor API tests

# Manual only: these tests act on the shared Noor test environment (support chat, a report,
# moderation approvals), so they must not run on every push. Actions → "Noor API tests" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Which suite to run
        type: choice
        default: all
        options: [all, delivery, eats, common, admin]

concurrency:
  group: noor-api-tests
  cancel-in-progress: false

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: noor-api-tests
    env:
      CI: true
      # Repository secrets (Settings → Secrets and variables → Actions). Optional ones may be left unset;
      # the tests that need them skip themselves.
      MERCHANT_PHONE: ${{ secrets.MERCHANT_PHONE }}
      MERCHANT_PASSWORD: ${{ secrets.MERCHANT_PASSWORD }}
      ADMIN_PHONE: ${{ secrets.ADMIN_PHONE }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CASHIER_PHONE: ${{ secrets.CASHIER_PHONE }}
      CASHIER_PASSWORD: ${{ secrets.CASHIER_PASSWORD }}
      MANAGER_PHONE: ${{ secrets.MANAGER_PHONE }}
      MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
      # Adding an employee sends an SMS — leave these unset unless the numbers are yours
      EMPLOYEE_TEST_PHONE: ${{ secrets.EMPLOYEE_TEST_PHONE }}
      EMPLOYEE_TEST_PHONE_2: ${{ secrets.EMPLOYEE_TEST_PHONE_2 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: noor-api-tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      # API tests only call the backend — no browser download needed
      - name: Run API tests
        run: |
          if [ "${{ inputs.project }}" = "all" ]; then npm test; else npx playwright test --project=${{ inputs.project }}; fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noor-api-report-${{ inputs.project }}
          path: noor-api-tests/playwright-report/
          retention-days: 14
